name: Validate temporary worker source

on:
  push:
    paths:
      - ".github/workflows/validate-worker-temp.yml"

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        shell: bash
        run: node --input-type=module --check < .tmp-gist/singbox-sub-converter.js
